name: Compile RedMagic 11 Pro Kernel (NX809J)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CLANG_VERSION: clang-r536225
      RUST_VERSION: 1.82.0
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libelf-dev libssl-dev rsync python3 python3-pip git wget libdw-dev zip dwarves gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu lld

      - name: Install Rust 1.82.0 and bindgen (required for CONFIG_RUST=y)
        run: |
          # Install Rust 1.82.0 (matches nx809j_defconfig CONFIG_RUSTC_VERSION=108200).
          # Without correct Rust version, olddefconfig disables CONFIG_RUST=y in cascade,
          # changing SYSVIPC/POSIX_MQUEUE/DEVTMPFS/ASHMEM_RUST flags and struct layouts
          # -> stock qti_battery_charger.ko crashes with NULL pointer dereference at strcmp.
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain "${RUST_VERSION}" --component rust-src
          source "$HOME/.cargo/env"
          rustup component add rust-src
          rustc --version
          # bindgen 0.69.5 (minimum 0.65.1, compatible with kernel 6.12 Rust bindings)
          cargo install --locked bindgen-cli@0.69.5
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Download Android Clang Compiler
        run: |
          echo "Downloading Android Clang ${CLANG_VERSION}..."
          git clone --filter=blob:none --sparse https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-bin
          cd clang-bin
          git sparse-checkout set "${CLANG_VERSION}"
          git checkout main
          mv "${CLANG_VERSION}" ..
          cd ..
          rm -rf clang-bin

      - name: Compile Kernel
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          export CLANG_DIR="$(pwd)/${CLANG_VERSION}"
          chmod +x super_build.sh
          ./super_build.sh 2>&1 | tee kernel-build.log

      - name: Compile Touchscreen Driver Module
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          export CLANG_DIR="$(pwd)/${CLANG_VERSION}"
          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          make -C kernel_platform/common M=drivers/soc/qcom/zte/zte_tpd LLVM=1 LLVM_IAS=1 KBUILD_MODPOST_WARN=1 modules
          cp kernel_platform/common/drivers/soc/qcom/zte/zte_tpd/zte_tpd.ko vendor/zte/zte_tpd/zte_tpd.ko

      - name: Compile KGSL GPU Driver Module (msm_kgsl.ko)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          export CLANG_DIR="$(pwd)/${CLANG_VERSION}"
          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          make -C kernel_platform/common M=../../vendor/qcom/opensource/graphics-kernel LLVM=1 LLVM_IAS=1 KBUILD_MODPOST_WARN=1 modules

      - name: Compile Adreno Overclock Module (adreno_overclock.ko)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          export CLANG_DIR="$(pwd)/${CLANG_VERSION}"
          export PATH="$CLANG_DIR/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          make -C kernel_platform/common M=../../vendor/qcom/opensource/zte-drivers/zte_adreno_overclock LLVM=1 LLVM_IAS=1 KBUILD_MODPOST_WARN=1 modules

      - name: Patch Touchscreen Driver (zte_tpd.ko)
        run: |
          if [ -f vendor/zte/zte_tpd/zte_tpd.ko ]; then
            echo "Patching touchscreen driver..."
            python3 vendor/zte/zte_tpd/patch_tpd.py stock_rom_modules/modules/zte_tpd.ko vendor/zte/zte_tpd/zte_tpd.ko
          else
            echo "Error: zte_tpd.ko not found after build!"
            exit 1
          fi

      - name: Repack and Sign Boot Image
        run: |
          chmod +x repack_perfect_sign.sh
          ./repack_perfect_sign.sh

      - name: Prepare release package
        if: success()
        run: |
          set -euo pipefail
          mkdir -p release-assets

          copy_asset() {
            local src="$1"
            local dest="${2:-$(basename "$src")}"
            if [ -f "$src" ]; then
              cp "$src" "release-assets/$dest"
              echo "asset: $dest"
            else
              echo "missing optional asset: $src"
            fi
          }

          copy_asset dev_reverse_perfect.img
          copy_asset kernel_platform/common/arch/arm64/boot/Image Image
          copy_asset vendor/zte/zte_tpd/zte_tpd.ko zte_tpd.ko
          copy_asset vendor/qcom/opensource/graphics-kernel/msm_kgsl.ko msm_kgsl.ko
          copy_asset vendor/qcom/opensource/zte-drivers/zte_adreno_overclock/adreno_overclock.ko adreno_overclock.ko
          copy_asset zte_custom_drivers.zip
          copy_asset rm11pro_gpu_oc_1250.zip
          copy_asset kernel_platform/common/System.map System.map
          copy_asset kernel_platform/common/.config kernel.config
          copy_asset kernel-build.log

          short_sha="${GITHUB_SHA::12}"
          git archive --format=tar.gz \
            --prefix="android_kernel_nubia_sm8850_qwjujube-${short_sha}/" \
            -o "release-assets/opensource-${short_sha}.tar.gz" \
            HEAD

          {
            echo "NX809J kernel build"
            echo "Run: ${GITHUB_RUN_NUMBER}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Branch/ref: ${GITHUB_REF_NAME}"
            echo "Clang: ${CLANG_VERSION}"
            echo "Rust: ${RUST_VERSION}"
            echo "Built at UTC: $(date -u -Is)"
            echo
            echo "Assets include boot image, modules, kernel config, System.map, build log, and the tracked opensource tree for this exact commit."
          } > release-assets/build-info.txt

      - name: Upload Boot Image
        uses: actions/upload-artifact@v4
        with:
          name: dev_reverse_perfect
          path: dev_reverse_perfect.img

      - name: Upload Patched Touchscreen Module
        uses: actions/upload-artifact@v4
        with:
          name: zte_tpd_patched
          path: vendor/zte/zte_tpd/zte_tpd.ko

      - name: Upload KGSL GPU Driver Module
        uses: actions/upload-artifact@v4
        with:
          name: msm_kgsl_ko
          path: vendor/qcom/opensource/graphics-kernel/msm_kgsl.ko

      - name: Upload Build Map and Config
        uses: actions/upload-artifact@v4
        with:
          name: build_map_config
          path: |
            kernel_platform/common/System.map
            kernel_platform/common/.config

      - name: Upload Magisk Module Zip
        uses: actions/upload-artifact@v4
        with:
          name: zte_custom_drivers_zip
          path: zte_custom_drivers.zip

      - name: Upload Adreno Overclock Module Zip
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rm11pro_gpu_oc_1250
          path: rm11pro_gpu_oc_1250.zip

      - name: Upload complete release package
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nx809j-release-package-${{ github.run_number }}
          path: release-assets/
          retention-days: 90

      - name: Create GitHub Release
        if: github.event_name != 'pull_request' && success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="build-run-${{ github.run_number }}-$(date -u +'%Y%m%d%H%M')"
          echo "Creating GitHub Release: $TAG_NAME"
          gh release create "$TAG_NAME" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "Build Run #${{ github.run_number }} (NX809J)" \
            --notes-file release-assets/build-info.txt
